services:
  backend:
    container_name: django_app
    build:
      context: ./backend/config
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend/config:/app  #
    working_dir: /app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=True
    env_file:
      - .env


  frontend:
    container_name: react_app
    build:
      context: ./frontend/react-app
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    command: npm run dev
    volumes:
      - ./frontend/react-app:/app
      - /app/node_modules
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true


networks:
  default:
    driver: bridge